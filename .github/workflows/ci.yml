name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell + native Windows regression checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Parse every PowerShell file (syntax gate)
        shell: pwsh
        run: |
          $problems = @()
          Get-ChildItem -Recurse -Include *.ps1,*.psm1,*.psd1 -File | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) {
              $problems += $errs | ForEach-Object { "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($problems) {
            $problems | ForEach-Object { Write-Host "::error::$_" }
            throw "PowerShell syntax errors found."
          }
          Write-Host "All PowerShell files parse cleanly."

      - name: PSScriptAnalyzer (errors fail the build)
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          # PSAvoidUsingComputerNameHardcoded is Error-severity but expected in a local PC toolkit.
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error -ExcludeRule PSAvoidUsingComputerNameHardcoded
          if ($issues) {
            $issues | Format-Table RuleName, ScriptPath, Line, Message -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer reported $($issues.Count) error-level issue(s)."
          }
          Write-Host "PSScriptAnalyzer: no error-level issues."

      - name: Toolkit static validation (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\Validate_All.ps1
          if ($LASTEXITCODE -ne 0) { throw "Toolkit static validation failed." }

      - name: Real registry, filesystem, worker and WPF regression checks
        shell: powershell
        run: |
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File .\tests\Test_Toolkit.ps1
          if ($LASTEXITCODE -ne 0) { throw "Toolkit regression checks failed." }

      - name: Regression checks in the installed friendly folder layout
        shell: powershell
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('ToolkitFriendly_' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($fixture)
          $layout = [ordered]@{
            Modules='Modules'; tests='tests'; 'pc-cleaner'='Pc Cleaner'
            'pc-gaming-optimizer'='Pc Gaming Optimizer'; 'pc-corruption-fixer'='Pc Corruption Fixer'
            'pc-privacy-guard'='Pc Privacy Guard'; 'dns-encrypted-doh'='Pc Privacy Guard\Optional DNS'
          }
          foreach ($folder in $layout.Keys) {
            Copy-Item -LiteralPath (Join-Path $PWD $folder) -Destination (Join-Path $fixture $layout[$folder]) -Recurse
          }
          foreach ($file in @('Toolkit.ps1','Toolkit.Worker.ps1','Toolkit.Run.ps1','Toolkit.xaml')) {
            Copy-Item -LiteralPath (Join-Path $PWD $file) -Destination $fixture
          }
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File (Join-Path $fixture 'tests\Test_Toolkit.ps1')
          if ($LASTEXITCODE -ne 0) { throw "Friendly-layout regression checks failed." }

  data:
    name: JSON + Python validation
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate JSON files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.json -File |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              try { $null = Get-Content $_.FullName -Raw | ConvertFrom-Json }
              catch { throw "Invalid JSON: $($_.FullName) -- $_" }
            }
          Write-Host "All JSON files valid."

      - name: Compile-check Python files (if any)
        shell: pwsh
        run: |
          $py = Get-ChildItem -Recurse -Include *.py -File | Where-Object { $_.FullName -notmatch 'node_modules' }
          if ($py) {
            python -m compileall -q .\
            if ($LASTEXITCODE -ne 0) { throw "Python compile check failed." }
            Write-Host "Python files compile cleanly ($($py.Count) files)."
          } else {
            Write-Host "No Python files found; skipping."
          }
